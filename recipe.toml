# The recipe's defaults. `local.toml` next to this file overrides them for one Mac (copy local.example.toml); an
# environment variable of the same name in upper case overrides both (PORT=8890 python3 -m mac up).

[model]
# DeepSeek's release, converted by tools/convert.py (on the Hub as below, README)
source_repo = "deepseek-ai/DeepSeek-V4.1-Flash-1017"
source_revision = "1bae0e1088993b9b82de08f59de5be5a34e42170"
served_name = "DeepSeek-V4.1-Flash"
# the converted checkpoint: routed experts 2-bit (groups of 64) but layers 10-29 at 3-bit (the requant study's pick),
# the blocks' projections 4-bit (decode 21.2 -> 17.7 ms a step; KL vs fp4 0.136 -> 0.145, top-1 0.905 both), the head
# and the vision tower 8-bit, the engram tables (189 GiB, three parts each) beside it on disk, read where a lookup lands
model_dir = "~/models/DeepSeek-V4.1-Flash-1017-TF-mix23-d8b4"
expert_bits = 2
layer_bits = "10-29:3"
dense_bits = 8
block_dense_bits = 4

[engine]
tensorfold_src = "~/github/TensorFold"   # a checkout holding the sha (BobClawblaw/TensorFold); `build` adds a worktree
tensorfold_sha = "04c41884be49c755a6deb3da90fbaac3cb1b06fe"   # the deepseek-v41-main branch's commit to build
zig = "~/tools/zig-0.17.0/zig"
zig_cpu = "native"                       # this Mac's M5 (the tensor-unit prompt kernels); apple_m1 for older chips
binary = ""                              # a prebuilt tensorfold-native to serve with instead of the pinned build

[local]
host = "127.0.0.1"
port = 8890
tf_cache = "~/.cache/tensorfold-deepseek-v41"

[serve]
context = 524288                 # positions the streams hold together (the model's window is 1,048,576: README)
drafts = true                    # the checkpoint's DSpark head (drafted replies equal plain ones)
thinking = true                  # the template's thinking mode by default (a request can turn it off)
max_tokens = 32768
thinking_reserve = 49152         # with thinking on, reasoning tokens beyond a request's max_tokens, which then limits the answer
loop_guard = true                # close reasoning that repeats itself verbatim (a short cycle, or a passage of 1,024+ tokens)
temperature = "0"
parallel = 4                     # streams at once: their windows share forwards, their caches `context`
prompt_cache_gib = 6             # kept prompt states; past the engine's 70% share (the weights take ~200 GiB)
prompt_cache_over_cap = true
vision = true                    # image input (image_url parts: data URLs; PNG and JPEG)
vision_image_tokens = 4096       # image tokens a request may hold in all (an image takes at most 1,024)
vision_max_images = 4
vision_urls = false              # also public HTTPS image URLs, fetched by the server (every address checked public)
keep_warm = 86400
api_key = ""
extra_args = ""
memory_margin_gib = 6            # `up` refuses when free memory is under the weights plus this
